name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: dev-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install
        working-directory: app
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: app
        run: ruff check .
      - name: Test
        working-directory: app
        run: PYTHONPATH=. python -m pytest -q
      - name: Docker build validation
        run: docker build -t devops-cicd-project:test ./app

  deploy:
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::861019856428:role/devops-cicd-github-actions-role
          aws-region: eu-west-2
          role-session-name: github-actions-cicd-dev
          allowed-account-ids: "861019856428"
      - name: Generate ephemeral SSH key
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          ssh-keygen -t ed25519 -N "" -f "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          echo "TF_VAR_ssh_public_key=$(cat "$RUNNER_TEMP/ssh/id_ed25519.pub")" >> "$GITHUB_ENV"
      - name: Detect runner IP
        run: |
          IP="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')"
          echo "TF_VAR_github_runner_cidr=${IP}/32" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Terraform
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false
          terraform fmt -check -recursive ../..
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
          echo "ECR_REPOSITORY=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"
          echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> "$GITHUB_ENV"
          echo "ASG_NAME=$(terraform output -raw asg_name)" >> "$GITHUB_ENV"
      - name: Build and push ECR image
        run: |
          REGISTRY="${ECR_REPOSITORY%/*}"
          aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$ECR_REPOSITORY:${GITHUB_SHA}" ./app
          docker push "$ECR_REPOSITORY:${GITHUB_SHA}"
          echo "APP_IMAGE=$ECR_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
      - name: Wait for ASG
        run: |
          for i in {1..30}; do
            COUNT="$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`]|length(@)' --output text)"
            echo "InService: $COUNT"
            [ "$COUNT" -ge 2 ] && exit 0
            sleep 20
          done
          exit 1
      - name: Install Ansible
        run: |
          python3 -m pip install ansible-core boto3 botocore
          ansible-galaxy collection install amazon.aws
      - name: Dynamic inventory
        working-directory: ansible
        run: ansible-inventory --graph
      - name: Wait for SSH
        working-directory: ansible
        run: |
          for i in {1..20}; do
            ansible role_app -m ping -u ec2-user --private-key "$RUNNER_TEMP/ssh/id_ed25519" && exit 0
            sleep 15
          done
          exit 1
      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          ansible-playbook playbooks/deploy.yml --private-key "$RUNNER_TEMP/ssh/id_ed25519"             -e "aws_region=eu-west-2" -e "ecr_registry=$ECR_REGISTRY"             -e "app_image=$APP_IMAGE" -e "app_environment=dev"
      - name: Verify ALB
        run: |
          for i in {1..20}; do
            curl -fsS "http://${ALB_DNS}/health" && echo && exit 0
            sleep 15
          done
          exit 1
