name: Terraform Dev

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-dev.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::861019856428:role/devops-cicd-github-actions-role
          aws-region: eu-west-2
          role-session-name: github-actions-terraform-dev
          allowed-account-ids: "861019856428"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Generate ephemeral SSH key pair
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          ssh-keygen -t ed25519 -N "" -f "$RUNNER_TEMP/ssh/id_ed25519"
          echo "TF_VAR_ssh_public_key=$(cat "$RUNNER_TEMP/ssh/id_ed25519.pub")" >> "$GITHUB_ENV"

      - name: Detect GitHub runner public IP
        run: |
          RUNNER_IP="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')"
          echo "GitHub runner IP: ${RUNNER_IP}"
          echo "TF_VAR_github_runner_cidr=${RUNNER_IP}/32" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform plan summary
        run: terraform show -no-color tfplan

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform output

      - name: Wait for ASG instances
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ASG_NAME="$(terraform output -raw asg_name)"
          for i in {1..30}; do
            COUNT="$(aws autoscaling describe-auto-scaling-groups               --auto-scaling-group-names "$ASG_NAME"               --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`]|length(@)'               --output text)"
            echo "InService instances: ${COUNT}"
            if [ "${COUNT}" -ge 2 ]; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Show ALB URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ALB_DNS="$(terraform output -raw alb_dns_name)"
          echo "Application URL: http://${ALB_DNS}"
